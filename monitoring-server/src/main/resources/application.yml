server:
  port: ${SERVER_PORT}

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    protocol: smtp
    test-connection: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      metrics:
        group-id: ${KAFKA_CONSUMER_METRICS_GROUP_ID}
      agent:
        group-id:  ${KAFKA_CONSUMER_AGENT_GROUP_ID}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "github.titandea.dto.*"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password:  ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.yaml
    default-schema: server

kafka:
  metrics-topic: ${KAFKA_METRICS_TOPIC}
  init-topic: ${KAFKA_INIT_TOPIC}
